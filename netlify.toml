# Netlify 部署配置
# - 拖拽 dist/web 到 Netlify Drop：不需要这份配置
# - 连 Git 仓库自动部署：Netlify 会执行 build 命令生成 dist/web
[build]
  command = "node tools/build.mjs"
  publish = "dist/web"

# Service Worker / HTML 不能被强缓存，否则用户拿不到新版本
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
